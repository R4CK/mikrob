<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<title>Ingatlan Ar-koveto -- beallitasok</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; }
  #status { margin-top: 1rem; font-weight: 600; }
  p.hint { color: #555; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Ingatlan Ar-koveto</h1>
  <p class="hint">A token-t a <code>npm run ingatlan:ingest</code> terminal-kimenete irja ki inditaskor. Masold be ide, csak egyszer kell.</p>

  <label for="token">Ingest token</label>
  <input id="token" type="text" autocomplete="off" spellcheck="false" />

  <label for="port">Port (alap: 8787)</label>
  <input id="port" type="number" min="1" max="65535" />

  <button id="save">Mentes</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
