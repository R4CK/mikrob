# MARVCI822: the repo's only workflow was the secret gate -- vitest and tsc
# never ran in CI for ANY PR, so every "N/N green" claim was a local
# measurement the PR head could not prove (found via the review of
# #1037/#1038, measured 2026-08-22).
#
# Deliberately NOT a required status check yet: flipping it to required at
# introduction would block every open PR whose head predates the workflow
# (the required-check-never-ran class). The switch to required is a separate
# owner/Marveen decision, gated on measuring how many open PRs run it green
# (decision msg 14205, recorded on the MARVCI822 card).
name: test

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Full install ON PURPOSE, unlike the secret-gate's --ignore-scripts:
      # the suite exercises native bindings, and an install that skips their
      # build would fail the ABI probe instead of measuring the code.
      - run: npm ci
      # #1565 item 4: the channel-image-resize tests build a REAL >500KB JPEG
      # with ffmpeg (a Buffer.alloc fixture let the hook claim a resize it never
      # did). ffmpeg is an installer dependency (install-linux.sh), so the
      # runner must have it too -- a missing binary is a real failure there,
      # not a reason to skip. ubuntu-latest does not ship it (measured: run
      # 36302092314, spawnSync ffmpeg ENOENT).
      - name: Install ffmpeg for the resize hook's tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The suite resolves the `claude` binary at module load (resolveFromPath
      # throws when it is absent) -- without this stub 17 suites fail at
      # COLLECTION, before a single test runs (measured on the first ubuntu
      # run). The stub satisfies PATH resolution only; it exits 1 LOUDLY, so if
      # any test ever actually executes claude, that run fails visibly instead
      # of silently faking success.
      - name: Stub the claude binary for PATH resolution
        run: |
          sudo install -m 755 /dev/stdin /usr/local/bin/claude <<'EOF'
          #!/bin/sh
          echo "claude CI stub: tests must not execute this binary" >&2
          exit 1
          EOF
      - run: npm run typecheck
      - run: npm test
      # Shell-test wiring (SEEDREFRESH826 fold-in, from the #1066 verify): a
      # regression guard that only runs manually rots exactly like a one-shot
      # seed. Runs natively here (ubuntu = the Linux branch it asserts).
      - run: bash scripts/__tests__/stop-start-system-unit.test.sh
      # Card b9a657e6: same reasoning as above -- ollama-boot-restore.sh guards a
      # boot-after-reboot path nobody exercises by hand day to day, so its own
      # selftest has to run somewhere other than a human remembering to.
      - run: bash scripts/__tests__/ollama-boot-restore.test.sh
      # UPSTREAM-SYNC (card 0b550d89, re-confirmed card 1a046537/batch 5, card 1f4c046b/batch 13,
      # card d06a325d/batch 18, card 8d625ccd/batch 17 and card 13b2648e/batch 18 round 2 (also
      # adds credential-gate.test.py, CREDGATE1003 -- same not-adopted new-security-gate cluster as
      # agentGetsCredentialGate/injectCredentialGate); decision recorded in
      # src/fork-upstream/acknowledged-conflicts.ts ~line 1314, card b992e9aa):
      # NOT adopting upstream's CI steps here (egress-drift-scan, dash-audit-scan, mio-orszem-precheck,
      # memory-link-audit, keepalive-probe-install, morning-stamp-gate, morning-timer-park,
      # userbot-arming-gate, supabase-q-token-hiding, and batch 13's telegram-reply-guard /
      # ledger-replay-reply-tool / conversation-ledger (REPLAYTOOL924)) -- each belongs to an
      # upstream feature (community sentinel, dash audit, keepalive probe, morning briefing timers,
      # userbot arming, supabase token hiding, reply-tool ledger naming) this fork has not decided to
      # adopt. Wiring CI to run them would be the adoption decision by accident. Driver scripts/tests
      # for some of these merge into the tree anyway via non-conflicting file adds -- left in place,
      # unwired, same shape as the fork's own scripts/memory-link-audit.py already sitting unwired
      # from an earlier round. Available for a future adoption card.
      # CORRECTION (card 42d952bc, Cybersec F5 comment 27301): the "same not-adopted new-security-gate
      # cluster" line above is now STALE for credential-gate.test.py specifically -- card 42d952bc
      # adopted scripts/hooks/credential-gate.py + this test file (Gate-SHA f163d6cc9). It is still
      # not wired as a raw CI step here; its own vitest wrapper (src/__tests__/credential-gate.test.ts)
      # runs it instead. agentGetsCredentialGate/injectCredentialGate remain a separate, genuinely
      # un-adopted upstream feature (a different, profile-gated per-sub-agent design) -- unaffected.
      # 723bbb70 (3): the hook-load watcher is a DIFFERENT, already-adopted fork feature
      # (scripts/hook-load-watch.py already shipped before this batch) -- not part of the
      # NOT-ADOPTED bundle above. Its contract only ran by hand until now, so wiring the
      # test here closes that gap. Hermetic: a throwaway install root, stand-in python and
      # node gates, a local stub for the alert POST.
      - run: python3 scripts/__tests__/hook-load-watch.test.py
